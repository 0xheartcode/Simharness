name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          # Pinned for reproducible CI; bump deliberately (mirror in README).
          deno-version: "2.9.8"

      # cli.ts references the Node `process` global, so `deno check` needs
      # @types/node from node_modules. A fresh CI checkout has none; install it.
      - name: Install npm dependencies
        run: deno install

      - name: make check
        run: make check

      - name: make compile (binary smoke test)
        run: |
          make compile
          ./dist/simharness --version
          cd examples/chase && ../../dist/simharness assert

      - name: make package (JSR publish dry run)
        run: make package
